# Local farm stack: Postgres only. The Astro site runs with `npm run dev` in web/.
# Host port 5433 avoids clashing with any Postgres already on 5432.

services:
  db:
    image: postgres:16-alpine
    container_name: meenakshi-db
    environment:
      POSTGRES_USER: meenakshi
      POSTGRES_PASSWORD: meenakshi_local
      POSTGRES_DB: meenakshi
    ports:
      - "5433:5432"
    volumes:
      - meenakshi_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meenakshi -d meenakshi"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  meenakshi_pgdata:
