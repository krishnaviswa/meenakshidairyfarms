name: iOS IPA

# Unsigned IPA is produced so you can download it from Actions → Artifacts.
# A real iPhone will only install it after you re-sign:
#   • Apple Developer + Ad Hoc / development profile, or
#   • Sideload with AltStore / Sideloadly using your Apple ID (7-day cert).
# To have CI sign it, add repo secrets later:
#   IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD, IOS_PROVISION_PROFILE_BASE64

on:
  workflow_dispatch:
  push:
    branches: [main, feat/docker-postgres-frontend]
    paths:
      - "app/**"
      - ".github/workflows/ios-ipa.yml"

jobs:
  ipa:
    name: Build iOS IPA
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --no-tree-shake-icons
      - name: Package IPA
        working-directory: app
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r MeenakshiDairyFarms.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: meenakshi-ios-ipa
          path: app/MeenakshiDairyFarms.ipa
          if-no-files-found: error
          retention-days: 30
